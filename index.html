<!DOCTYPE html>
<html lang='pt-br'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Clicker</title>
    <link rel='stylesheet' href='style.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Pixelify+Sans:wght@400..700&family=Red+Rose:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sawarabi+Mincho&family=VT323&display=swap"
        rel="stylesheet">

    <link rel="apple-touch-icon" sizes="180x180" href="img/icones/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/icones/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/icones/favicon-16x16.png">
    <link rel="manifest" href="img/icones/site.webmanifest">
    <script src="main.js" defer></script>

</head>

<body>
    <!-- div para a confirmação do reset-->
    <div></div>

    <!--botao que vai chamar o reset-->
    <button onclick="chamarReset()" class="botaoEscondidoReset">Resetar</button>
    <!--caixa do reset e seus conteudos-->
    <div id="CaixaReset" class="resetEscondido">
        <p>Deseja apagar sua pescaria?</p>
        <div class="botoes-confirmacao">
            <button onclick="confirmarResetTotal()" id="botaoConfirma">Sim, deletar</button>
            <button onclick="fecharCaixaReset()" id="botaoCancela">Cancelar</button>
        </div>
    </div>

    <!--pontuacao-->
    <main>
        <div class="pontos">
            <h1>Pontuação: <span id="moedas">0</span></h1>
            <p>Ganhos: <span id="produção">0</span>s</p>
        </div>
        <div>

            <img class="botaoPescar" id="BotaoDePontos" onclick="pontos()" src="img/barco-botao.png"
                alt="botao de pesca">
        </div>

    </main>
    <!--melhorias -->
    <div>
        <h2>Melhorias:</h2>

        <button class="melhoriasbtn" onclick="pontosPorPesca()">
            Dobrar Clique:<span id="ClickDobrado">50</span> Pontos

        </button>

        <button class="melhoriasbtn" onclick="upgrade()">
            Contratar Pescador:<span id="autoClicker">100</span> Pontos
        </button>
        <!--caixa do alerta-->
    </div>
    <div id="caixaAviso" class="avisoEscondido">

        <p id="textoAviso">Pontos insuficientes!</p>
    </div>


</body>

</html>
